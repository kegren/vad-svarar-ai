<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
body{margin:0;background:#3b3f44;color:#e9e4da;font-family:Inter,system-ui,sans-serif;width:390px;height:844px;overflow:hidden}
.panel{margin:14px;background:#2c2f33;border-radius:18px;height:calc(100% - 28px);padding:18px;box-sizing:border-box;box-shadow:inset 0 1px 0 #ffffff14}
.skarm{background:#1b1407;border-radius:8px;padding:14px;color:#ffb547;font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.skarm small{display:block;font-size:12px;color:#c98d33;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;margin:22px 0 0;font-weight:650}
.falt{margin-top:18px;height:54px;border-radius:10px;background:#e4ded2;color:#6b665e;display:flex;align-items:center;padding:0 16px;font-size:18px}
.tangenter{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t{height:66px;border-radius:10px;background:#d8d2c6;color:#2c2f33;font-size:11px;font-weight:700;display:flex;align-items:flex-end;padding:8px;box-shadow:0 3px 0 #9d978c}
.go{margin-top:14px;height:62px;border-radius:12px;background:#ff5f1f;color:#1b1407;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #b8400f}
</style></head><body><div class="panel">
<div class="skarm"><small>Nämns i</small>0 av 8 svar</div>
<h1>Syns ditt företag när kunderna frågar AI?</h1>
<div class="falt">Företagets namn</div>
<div class="tangenter"><div class="t">ChatGPT</div><div class="t">Gemini</div><div class="t">Claude</div><div class="t">Perplexity</div></div>
<div class="go">Fråga AI</div>
</div></body></html>
